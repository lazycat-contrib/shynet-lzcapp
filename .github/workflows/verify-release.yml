name: Verify Shynet Release on GitHub
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: false
        default: v0.13.1
permissions:
  contents: read
concurrency:
  group: shynet-release-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="$(gh release view --json tagName --jq .tagName)"; fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Download exact Release asset on runner
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ASSET_NAME="community.lazycat.app.shynet-${RELEASE_TAG}.lpk"
          echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"
          gh release view "$RELEASE_TAG" --json tagName,assets > release-metadata.json
          gh release download "$RELEASE_TAG" --pattern "$ASSET_NAME" --dir verify-pkg

      - name: Verify package contents
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, tarfile, yaml

          tag = os.environ['RELEASE_TAG']
          name = os.environ['ASSET_NAME']
          pkg = __import__('pathlib').Path('verify-pkg') / name
          assert pkg.is_file(), pkg

          h = hashlib.sha256()
          with pkg.open('rb') as fh:
              for chunk in iter(lambda: fh.read(1 << 20), b''):
                  h.update(chunk)

          with tarfile.open(pkg, 'r:') as package:
              members = package.getnames()
              for required in ('manifest.yml', 'package.yml', 'content.tar', 'icon.png'):
                  assert required in members, (required, members)

              info = yaml.safe_load(package.extractfile('package.yml').read())
              assert info['package'] == 'community.lazycat.app.shynet', info['package']
              assert info['name'] == 'Shynet', info['name']
              assert info['version'] == tag.lstrip('v'), (info['version'], tag)
              assert info['license'] == 'Apache-2.0', info['license']
              assert info['min_os_version'] == '1.5.0', info['min_os_version']

              raw = package.extractfile('manifest.yml').read().decode()
              m = yaml.safe_load(raw)
              app = m['application']
              assert app['subdomain'] == 'shynet', app['subdomain']
              ups = app['upstreams']
              assert any(u['location'] == '/' and 'shynet:8080' in (u.get('backend') or '')
                         for u in ups), ups

              svcs = m['services']
              assert set(svcs) == {'shynet'}, set(svcs)

              svc = svcs['shynet']
              assert 'milesmcc/shynet' in svc['image'], svc['image']
              assert svc['image'].endswith(':' + tag), svc['image']

              env = ' '.join(str(x) for x in svc['environment'])
              # Django would otherwise fall back to the literal "onlyusethisindev"
              assert 'DJANGO_SECRET_KEY=' in env and 'stable_secret' in env, env
              # Host-header validation rejects the public domain without this
              assert 'ALLOWED_HOSTS=' in env and '.S.AppDomain' in env, env
              # login posts are rejected without a trusted https origin
              assert 'CSRF_TRUSTED_ORIGINS=https://' in env, env
              assert 'SQLITE=True' in env, env
              assert any(b.endswith(':/var/local/shynet') for b in svc['binds']), svc['binds']

              # the admin comes from deploy params, never from a built-in default
              assert 'ADMIN_EMAIL=' in env and '.U.admin_email' in env, env
              assert 'ADMIN_PASSWORD=' in env and '.U.admin_password' in env, env
              assert svc.get('entrypoint') == ['/lzcapp/pkg/content/create-admin.sh'], svc.get('entrypoint')

              params = yaml.safe_load(package.extractfile('deploy_params.yml').read())
              by_id = {q['id']: q for q in params['params']}
              assert set(by_id) == {'admin_email', 'admin_password'}, set(by_id)
              assert by_id['admin_password']['type'] == 'secret'
              assert 'random' in str(by_id['admin_password'].get('default_value', ''))
              refs = set(re.findall(r'\.U\.([A-Za-z0-9_]+)', raw))
              assert refs <= set(by_id), (refs, set(by_id))

              assert 'lzc-file-chooser' not in raw
              assert 'usage' in m and str(m['usage']).strip(), 'usage section missing'
              usage_text = str(m['usage'])
              assert ('真机验证' in usage_text or '实机验证' in usage_text), 'usage must state no device test'

              with tarfile.open(fileobj=package.extractfile('content.tar')) as content:
                  cmembers = content.getnames()
                  lic = [n for n in cmembers if 'licenses/' in n]
                  assert lic, cmembers
                  main_lic = [n for n in lic if n.endswith('/LICENSE')]
                  target = main_lic[0] if main_lic else lic[0]
                  license_text = content.extractfile(target).read().decode()
                  assert 'GNU AFFERO GENERAL PUBLIC LICENSE' in license_text, license_text[:120]

                  scripts = [n for n in cmembers if n.endswith('entrypoint.sh')]
                  assert len(scripts) >= 2, scripts
                  joined = ' '.join(content.extractfile(s).read().decode() for s in scripts)
                  assert 'layout assign' in joined, 'layout bootstrap missing'
                  assert 'layout apply' in joined, 'layout apply missing'

          result = {
              'verified': True,
              'tag': tag,
              'sha256': h.hexdigest(),
              'size': pkg.stat().st_size,
              'runtime_tested': False,
              'note': 'layout bootstrap + bcrypt auth init container both verified in-package',
          }
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('```json\n' + json.dumps(result, indent=2) + '\n```\n')
          PY
